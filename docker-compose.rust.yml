# Phase 9 cutover overlay: Rust is the :3000 bot. Node stays one release as
# profile `node` on 127.0.0.1:3001 (moneypenny-node).
#
#   docker compose -f docker-compose.yml -f docker-compose.rust.yml \
#     --profile core --profile rust up --build
#
# Do not apply this overlay against the production checkout at
# Projects/moneypenny — this file lives on feat/rust-bot-rewrite.

services:
  bot:
    profiles: ["node"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - BOT_RUNTIME=node

  bot-rust:
    profiles: ["core", "rust"]
    build:
      context: .
      dockerfile: crates/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - BOT_RUNTIME=rust
      - BIND_ADDRESS=${BIND_ADDRESS:-0.0.0.0}
      - MONEYPENNY_DATA_DIR=/app/data
      - MONEYPENNY_WEB_DIST=/app/web/dist
      - MUSIC_DIR=/music
      - RKLLAMA_URL=${RKLLAMA_URL:-http://ollama:11434}
      - RKLLAMA_MODEL=${RKLLAMA_MODEL:-hf.co/unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://turbovec:6333}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - WATCHDOG_MEMORY_MB=${WATCHDOG_MEMORY_MB:-0}
      - MEMPALACE_URL=${MEMPALACE_URL:-}
      - STREAM_BRIDGE_URL=${STREAM_BRIDGE_URL:-}
      - SPOTIFY_BRIDGE_URL=${SPOTIFY_BRIDGE_URL:-}
      - TIDAL_BRIDGE_URL=${TIDAL_BRIDGE_URL:-}
      - MCP_ENABLED=${MCP_ENABLED:-0}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - YT_DLP=${YT_DLP:-}
    volumes:
      - ./bot/data:/app/data
      - ${MUSIC_HOST_DIR:-${MUSIC_DIR:-/mnt/music}}:/music
      - ./bot/web/dist:/app/web/dist:ro
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/moneypenny/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - moneypenny
    user: "1000:1000"
