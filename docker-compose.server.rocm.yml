# Optional ROCm Ollama for Server edition (when host Ollama is not used).
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml \
#     -f docker-compose.server.rocm.yml --profile ollama up -d
#
# Prefer host Ollama on AMD (docs/gpu-amd.md). This overlay is the container path.

services:
  ollama:
    image: ollama/ollama:rocm
    # GPU 1 only. Do not pass every /dev/dri node — GPU 0 is the desk/game card.
    devices:
      - /dev/kfd
      - ${PENNY_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - HIP_VISIBLE_DEVICES=0
      - GGML_VK_VISIBLE_DEVICES=0
    # Prefer host ollama-penny.service (docs/gpu-amd.md) over this container.
