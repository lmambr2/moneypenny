[workspace]
resolver = "2"
members = [
  "moneypenny",
  "mp-audio",
  "mp-brain",
  "mp-config",
  "mp-control",
  "mp-db",
  "mp-economy",
  "mp-http",
  "mp-mcp",
  "mp-music",
  "mp-radio",
  "mp-rag",
  "mp-rights",
  "mp-ts",
  "mp-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Lane Ambrose"]
publish = false
repository = "https://github.com/lmambr2/moneypenny"
rust-version = "1.85"

[workspace.dependencies]
audiopus = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
base64 = "0.22"
bcrypt = "0.17"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
