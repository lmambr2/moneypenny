[package]
name = "moneypenny"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Moneypenny bot binary — boot, watchdog, graceful shutdown"

[[bin]]
name = "moneypenny"
path = "src/main.rs"

[features]
default = ["ts6"]
ts6 = ["mp-ts/tsclient-rs"]
sbc = []
server = []
npu = []

[dependencies]
clap.workspace = true
dotenvy.workspace = true
mp-audio = { path = "../mp-audio" }
mp-config = { path = "../mp-config" }
mp-control = { path = "../mp-control" }
mp-db = { path = "../mp-db" }
mp-brain = { path = "../mp-brain" }
mp-http = { path = "../mp-http" }
mp-music = { path = "../mp-music" }
mp-rag = { path = "../mp-rag" }
mp-rights = { path = "../mp-rights" }
mp-ts = { path = "../mp-ts" }
mp-voice = { path = "../mp-voice" }
mp-radio = { path = "../mp-radio" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
