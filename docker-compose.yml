# Moneypenny — docker compose orchestration
#
# The bot needs an OpenAI-compatible LLM endpoint (RKLLAMA_URL); pick ONE LLM
# backend profile for your hardware. ./install.sh selects these automatically
# by architecture.
#
# Profiles:
#   core     : the bot itself (always)
#   npu      : rkllama on the RK3588 NPU   (aarch64 / Orange Pi)
#   ollama   : Ollama CPU/GPU inference     (x86-64 / generic)
#   voice    : Kokoro STT/TTS services      (Phase 2)
#   server   : optional TS6 server          (if you don't have one)
#
# Examples:
#   x86-64:        docker compose --profile core --profile ollama up -d
#   Orange Pi NPU: docker compose -f docker-compose.yml -f docker-compose.npu.yml \
#                    --profile core --profile npu up -d

services:
  # Optional: stand up a TS6 instance (use only if you don't already have one)
  teamspeak:
    image: teamspeak:latest
    profiles: ["server"]
    restart: unless-stopped
    ports:
      - "9987:9987/udp"   # voice
      - "30033:30033/tcp" # file transfer
      - "10080:10080/tcp" # web query
      - "10022:10022/tcp" # SSH query (TS6)
    environment:
      - TS3SERVER_LICENSE=accept
    volumes:
      - ts-data:/var/ts3server/
    networks:
      - moneypenny

  # RKLLama — NPU LLM inference (OpenAI compatible). aarch64 / RK3588 only.
  # Native inference also needs docker-compose.npu.yml (host librkllmrt mount).
  rkllama:
    build:
      context: ./services/rkllama
      dockerfile: Dockerfile
    profiles: ["npu"]
    restart: unless-stopped
    # NPU device passthrough is added by docker-compose.npu.yml (native backend
    # only) — kept out of the base so the mock backend runs on any host.
    volumes:
      - ./models:/models:ro
      - rkllama-cache:/root/.cache
      # Native backend: mount the host runtime installed by install-npu.sh.
      # Uncomment on the Orange Pi (the file must exist or compose will error):
      # - /usr/lib/librkllmrt.so:/usr/lib/librkllmrt.so:ro
    ports:
      - "127.0.0.1:8080:8080"   # OpenAI-compatible API — localhost only
    environment:
      # mock = no NPU (canned/echo, for dev + bot end-to-end validation).
      # Set to "native" on the board (and uncomment the librkllmrt mount above).
      - RKLLM_BACKEND=${RKLLM_BACKEND:-mock}
      - MODEL_PATH=/models/qwen3-1.7b-instruct-w8a8.rkllm
      - MAX_CONTEXT=2048
    networks:
      - moneypenny
    # Native inference requires the host NPU driver + librkllmrt 1.2.x (install-npu.sh).

  # The Moneypenny bot itself (fork + our changes)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    profiles: ["core"]
    restart: unless-stopped
    # No hard depends_on the LLM: the bot starts fine without one (LLM features
    # are gated and configurable from the web UI), and the backend varies by
    # arch (rkllama / ollama / external). It reaches the chosen one via RKLLAMA_URL.
    env_file:
      # Optional — the bot also configures via the web UI / config.json, so a
      # missing .env (e.g. before first setup) shouldn't block startup.
      - path: .env
        required: false
    environment:
      # Bind all interfaces *inside* the container; the published port below is
      # restricted to localhost on the host, so the UI is not LAN-exposed by
      # default. To reach it over the LAN, change the publish to
      # "0.0.0.0:3000:3000" AND firewall :3000 to the LAN in UFW (DESIGN §11).
      - BIND_ADDRESS=0.0.0.0
      # OpenAI-compatible LLM endpoint. Defaults to the NPU service; the installer
      # overrides via .env (e.g. http://ollama:11434 on x86-64).
      - RKLLAMA_URL=${RKLLAMA_URL:-http://rkllama:8080}
      - RKLLAMA_MODEL=${RKLLAMA_MODEL:-qwen3-1.7b}
    volumes:
      # All mutable state (SQLite, logs, avatars, config.json) lives here. Must
      # be writable by uid 1000 (the non-root 'moneypenny' user):
      #   mkdir -p bot/data && sudo chown -R 1000:1000 bot/data
      - ./bot/data:/app/data
      - ${MUSIC_DIR:-/mnt/music}:/music:ro
    ports:
      - "127.0.0.1:3000:3000"   # web UI/API — localhost-only by default (§11)
    # Hardening (DESIGN §11): non-root user (Dockerfile), read-only root fs with
    # state confined to the data volume, no privilege escalation, all caps dropped.
    read_only: true
    tmpfs:
      - /tmp                       # ffmpeg/yt-dlp/TTS scratch
      - /home/moneypenny/.cache      # yt-dlp / tool caches
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - moneypenny

  # Ollama — CPU/GPU LLM inference (OpenAI-compatible at /v1) for x86-64 and any
  # non-NPU host. The installer pulls a small model after first start.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # OpenAI-compatible API — localhost only
    networks:
      - moneypenny
    # NVIDIA GPU: install nvidia-container-toolkit on the host and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Phase 2: Kokoro TTS (CPU, high quality)
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi:latest
    profiles: ["voice"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      - MODEL_PATH=/app/models/kokoro-v0_19.onnx  # or whatever the image expects
    volumes:
      - kokoro-models:/app/models
    networks:
      - moneypenny

volumes:
  ts-data:
  rkllama-cache:
  ollama-models:
  kokoro-models:

networks:
  moneypenny:
    driver: bridge
