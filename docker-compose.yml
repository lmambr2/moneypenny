# Moneypenny — docker compose orchestration
#
# TWO EDITIONS (docs/editions.md, RELEASES.md):
#   sbc:    -f docker-compose.yml -f docker-compose.sbc.yml
#   server: -f docker-compose.yml -f docker-compose.server.yml
# ./install.sh --edition sbc|server|auto writes COMPOSE_FILE + COMPOSE_PROFILES.
#
# Profiles:
#   core        : the bot itself (always)
#   npu         : rkllama on the RK3588 NPU (SBC offline opt-in only)
#   ollama      : Ollama CPU/GPU inference (embeddings both; chat on server)
#   voice-edge  : Whisper STT base (RKNN NPU) + piper-tts — SBC (stt-rknn overlay)
#   voice-server: Whisper STT medium + piper-tts — Server (whisper.cpp)
#   voice-dev   : stt-mock only (CI)
#   (Removed: profile "voice" / sherpa-stt / Kokoro — V2 2026-07)
#   rag         : Qdrant vector store
#   memory      : MemPalace semantic memory bridge
#   stream      : Tidal bridge
#   server      : optional TS6 server container
#
# Examples:
#   Server:  docker compose -f docker-compose.yml -f docker-compose.server.yml \
#              --profile core --profile ollama --profile rag --profile voice-server up -d
#   SBC:     docker compose -f docker-compose.yml -f docker-compose.sbc.yml \
#              --profile core --profile ollama --profile rag --profile voice-edge up -d
#   NPU opt: ... -f docker-compose.npu.yml --profile npu

services:
  # Optional: stand up a TS6 instance (use only if you don't already have one)
  teamspeak:
    image: teamspeak:latest
    profiles: ["server"]
    restart: unless-stopped
    ports:
      - "9987:9987/udp"   # voice
      - "30033:30033/tcp" # file transfer
      - "10080:10080/tcp" # web query
      - "10022:10022/tcp" # SSH query (TS6)
    environment:
      - TS3SERVER_LICENSE=accept
    volumes:
      - ts-data:/var/ts3server/
    networks:
      - moneypenny

  # Hand-rolled RKLLama gateway — OpenAI /v1 over librkllmrt 1.3.x (aarch64 / RK3588).
  # Model: ./models/npu-llm/*.rkllm (see docker-compose.npu.yml for NPU mounts).
  rkllama:
    build:
      context: ./services/rkllama
      dockerfile: Dockerfile
    profiles: ["npu"]
    privileged: true
    restart: unless-stopped
    volumes:
      - ./models:/models
    ports:
      - "127.0.0.1:8080:8080"   # OpenAI-compatible API — localhost only
    networks:
      - moneypenny

  # The Moneypenny bot itself (fork + our changes)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    profiles: ["core"]
    restart: unless-stopped
    # No hard depends_on the LLM: the bot starts fine without one (LLM features
    # are gated and configurable from the web UI), and the backend varies by
    # arch (rkllama / ollama / external). It reaches the chosen one via RKLLAMA_URL.
    env_file:
      # Optional — the bot also configures via the web UI / config.json, so a
      # missing .env (e.g. before first setup) shouldn't block startup.
      - path: .env
        required: false
    environment:
      # Bind all interfaces *inside* the container; the published port below is
      # restricted to localhost on the host, so the UI is not LAN-exposed by
      # default. To reach it over the LAN, change the publish to
      # "0.0.0.0:3000:3000" AND firewall :3000 to the LAN in UFW (DESIGN §11).
      - BIND_ADDRESS=0.0.0.0
      # OpenAI-compatible LLM endpoint. Defaults to Ollama + Gemma 4 E2B (the
      # validated default — NPU gives no decode speedup, see ROADMAP); the
      # installer overrides via .env, and --llm npu repoints these at rkllama.
      - RKLLAMA_URL=${RKLLAMA_URL:-http://ollama:11434}
      - RKLLAMA_MODEL=${RKLLAMA_MODEL:-hf.co/unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL}
      # RAG (Phase 5). Empty embedding URL → reuses the LLM endpoint (ollama).
      # Override EMBEDDING_MODEL in .env if needed (default embeddinggemma).
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma}
      # Pi CPU embeddinggemma can take 3+ min/batch — avoid 180s ingest timeouts.
      - EMBEDDING_TIMEOUT_MS=${EMBEDDING_TIMEOUT_MS:-600000}
      # Phase 7 MemPalace (profile memory). URL only — enable toggles in Settings.
      - MEMPALACE_URL=${MEMPALACE_URL:-}
      # File-drop disk mount (optional — see TS6_FILES_HOST_DIR volume above)
      - TS6_FILES_DIR=${TS6_FILES_DIR:-}
      - TS6_VIRTUAL_SERVER_ID=${TS6_VIRTUAL_SERVER_ID:-1}
      # Container path is always /music (volume mount below). .env MUSIC_DIR is the
      # *host* bind source (e.g. ./music) — do not pass that through or uploads
      # resolve to /app/music on the read-only rootfs.
      - MUSIC_DIR=/music
    volumes:
      # All mutable state (SQLite, logs, avatars, config.json) lives here. Must
      # be writable by uid 1000 (the non-root 'moneypenny' user):
      #   mkdir -p bot/data && sudo chown -R 1000:1000 bot/data
      - ./bot/data:/app/data
      # Music library (scanned by LocalProvider). rw (not :ro) to support uploads
      # from the web UI (Library page). Web uploads are isolated under the
      # `uploads/` subdirectory (see LocalProvider.uploadSong + "secure that mfer"
      # comments). This makes it easy to audit, permission, snapshot or exclude
      # UI-added tracks separately from your main managed library.
      # The bot process runs as uid 1000 inside the container.
      # For Upload to succeed on the *host*:
      #   sudo mkdir -p "$MUSIC_DIR/uploads" && sudo chown -R 1000:1000 "$MUSIC_DIR"
      # If you only ever add music from the host (scp/rsync/NFS) and never intend
      # to use the UI upload button, you can change this line to end with :ro .
      - ${MUSIC_HOST_DIR:-${MUSIC_DIR:-/mnt/music}}:/music
      # Co-located TS6 only: read-only bind of the server's file repo so file-drop
      # can scan dropped files on disk (bypasses ftgetfilelist on TS6 beta). Set
      # TS6_FILES_HOST_DIR to the host `files/` tree and TS6_FILES_DIR=/ts6-files.
      - ${TS6_FILES_HOST_DIR:-/tmp/moneypenny-no-ts-files}:/ts6-files:ro
    ports:
      - "127.0.0.1:3000:3000"   # web UI/API — localhost-only by default (§11)
    # Hardening (DESIGN §11): non-root user (Dockerfile), read-only root fs with
    # state confined to the data volume, no privilege escalation, all caps dropped.
    read_only: true
    tmpfs:
      - /tmp                       # ffmpeg/yt-dlp/TTS scratch
      - /home/moneypenny/.cache      # yt-dlp / tool caches
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - moneypenny

  # Ollama — CPU/GPU LLM inference (OpenAI-compatible at /v1) for x86-64 and any
  # non-NPU host. The installer pulls a small model after first start.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # OpenAI-compatible API — localhost only
    environment:
      # Keep LLM + embedding models resident — !ask needs both on the Pi.
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - moneypenny
    # NVIDIA GPU: install nvidia-container-toolkit on the host and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Dual-track STT (same service name → bot always uses http://stt-whisper:9000).
  # Edition overlays swap the image:
  #   SBC:    services/stt-rknn        (NPU RKNN → faster-whisper CPU fallback)
  #   Server: services/stt-whisper-cpp (whisper.cpp + optional Vulkan)
  # Base build = legacy faster-whisper (dev / unoverlaid).
  # Bot: voice.sttUrl=http://stt-whisper:9000  + textWakeFallback=true
  stt-whisper:
    build:
      context: ./services/stt-whisper
      dockerfile: Dockerfile
    profiles: ["voice-edge", "voice-server"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - STT_MODEL=${STT_MODEL:-tiny}
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-}
      - STT_BACKEND=${STT_BACKEND:-faster-whisper}
      - STT_EAGER_LOAD=${STT_EAGER_LOAD:-1}
      - STT_MODELS_DIR=${STT_MODELS_DIR:-/models}
      - RKNN_MODELS_DIR=${RKNN_MODELS_DIR:-/models/rknn}
      - STT_FALLBACK=${STT_FALLBACK:-faster-whisper}
    volumes:
      - whisper-models:/models
      - whisper-fw-cache:/root/.cache
    networks:
      - moneypenny

  # Dev-only STT mock (fixed transcript) — no model download, instant CI smoke.
  stt-mock:
    build:
      context: ./services/stt-mock
      dockerfile: Dockerfile
    profiles: ["voice-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      - MOCK_STT_TEXT=${MOCK_STT_TEXT:-skip}
    networks:
      - moneypenny

  # Piper TTS — OpenAI /v1/audio/speech (KokoroTtsClient name is historical).
  # Bot: voice.ttsUrl=http://piper-tts:8880
  # Optional: mount a Piper .onnx and set PIPER_MODEL=/models/voice.onnx
  piper-tts:
    build:
      context: ./services/piper-tts
      dockerfile: Dockerfile
    profiles: ["voice-edge", "voice-server"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      - PIPER_VOICE=${PIPER_VOICE:-en_GB-southern_english_female-low}
      - PIPER_MODEL=${PIPER_MODEL:-/models/en_GB-southern_english_female-low.onnx}
      - PIPER_BIN=${PIPER_BIN:-piper}
    volumes:
      - piper-models:/models
    networks:
      - moneypenny

  # Phase 3: Tidal stream bridge (DESIGN §7.3) — real HiFi streaming via your
  # Tidal account. One-time device login: after `--profile stream up -d`, run
  # `docker compose logs -f tidal-bridge`, open the link.tidal.com URL it prints,
  # authorize once (token cached in the tidal-session volume). Then set
  # STREAM_BRIDGE_URL=http://tidal-bridge:8081 in .env so the bot streams Tidal
  # links directly. (No bridge → Tidal/Spotify links resolve to YouTube instead.)
  tidal-bridge:
    build: ./services/tidal-bridge
    profiles: ["stream"]
    restart: unless-stopped
    environment:
      - TIDAL_QUALITY=${TIDAL_QUALITY:-LOSSLESS}
    volumes:
      - tidal-session:/data
    networks:
      - moneypenny

  # R-R6: Spotify librespot bridge (playlist expand + resolve). Needs Premium +
  # optional LIBRESPOT_HTTP_BASE for real audio. See services/spotify-bridge/README.md
  # STREAM_BRIDGE_URL=http://spotify-bridge:8082  (or tidal-bridge for Tidal).
  spotify-bridge:
    build: ./services/spotify-bridge
    profiles: ["spotify", "stream"]
    restart: unless-stopped
    environment:
      - LIBRESPOT_HTTP_BASE=${LIBRESPOT_HTTP_BASE:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      - SPOTIFY_ACCESS_TOKEN=${SPOTIFY_ACCESS_TOKEN:-}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - moneypenny

  # ROADMAP Phase 7: MemPalace semantic memory bridge. Per-user facts sync here
  # for semantic recall in !ask. First start downloads the embedding model
  # (healthcheck start-period is long). Set MEMPALACE_URL=http://mempalace-bridge:8090
  # in Settings or .env when using this profile.
  mempalace-bridge:
    build: ./services/mempalace-bridge
    profiles: ["memory"]
    restart: unless-stopped
    volumes:
      - mempalace-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - moneypenny

  # ROADMAP Phase 5: Qdrant vector store (RAG substrate). Multi-arch (arm64 +
  # amd64) so it serves both the RK3588 and the x86+GPU track unchanged; the bot
  # reaches it at http://qdrant:6333. Opt-in via the `rag` profile.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["rag"]
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - moneypenny

volumes:
  ts-data:
  rkllama-cache:
  ollama-models:
  whisper-models:
  whisper-fw-cache:
  piper-models:
  mempalace-data:
  qdrant-storage:
  tidal-session:

networks:
  moneypenny:
    driver: bridge
