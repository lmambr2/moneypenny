[package]
name = "datarunner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Linux-native Star Citizen terminal datarunner for Moneypenny / UEX"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
notify = { version = "7", default-features = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
