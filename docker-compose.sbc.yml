# Moneypenny — SBC edition overlay (Orange Pi 5 Max / RK3588 arm64)
#
# Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.sbc.yml \
#     --profile core --profile ollama --profile rag --profile voice-edge up -d
#
# Or: ./install.sh --edition sbc
#
# Defaults: edge Whisper base on NPU (RKNN), Piper British TTS, on-device
# ollama for embeddings + E2B fallback. Point llmUrl at a LAN server for
# fast chat (docs/remote-llm.md, docs/editions.md).

# RK3588 is big.LITTLE: cores 0-3 are Cortex-A55 @1.8GHz (part 0xd05), cores 4-7
# are Cortex-A76 @2.3GHz (part 0xd0b). The vendor kernel's energy-aware scheduler
# prefers little cores for modest loads, which is wrong for a 20ms Opus frame
# deadline — an audio thread parked on an A55 is a jitter source even on an idle
# box. Latency-sensitive services get the A76 cluster; throughput services get the
# A55s and stay out of the way.
#
# Override per host if your board differs; empty string disables pinning.
x-cpuset-latency: &cpuset-latency ${CPUSET_LATENCY:-4-7}
x-cpuset-bulk: &cpuset-bulk ${CPUSET_BULK:-0-3}

services:
  # TS6 is a packet relay — clients do the Opus work, the server forwards UDP to
  # subscribers. Measured at 1.4% CPU / 24 MB on this board, and a full 32-slot
  # server is still a few percent of one core. Two A55s is far more than it needs;
  # the point is a dedicated pair so an ollama embedding burst cannot starve the
  # voice relay, while leaving the A76 cluster entirely to the audio path.
  teamspeak:
    cpuset: ${CPUSET_TS:-0-1}

  bot:
    # Opus encode/decode on a 20ms cadence + voice routing.
    cpuset: *cpuset-latency
    environment:
      # On-device fallback + install defaults. Split-brain chat URL lives in
      # config.json (llmUrl) — not forced here so LAN overrides stick.
      - RKLLAMA_URL=${RKLLAMA_URL:-http://ollama:11434}
      - RKLLAMA_MODEL=${RKLLAMA_MODEL:-hf.co/unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://ollama:11434}
      # Nomic Embed v2 MoE — SBC-friendly, 768-d English/multilingual
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - EMBEDDING_TIMEOUT_MS=${EMBEDDING_TIMEOUT_MS:-600000}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://turbovec:6333}
      - MONEYPENNY_EDITION=sbc

  ollama:
    # Throughput, not latency: embeddings and the E2B fallback tolerate the A55s
    # and this keeps them off the cores the audio path needs.
    cpuset: *cpuset-bulk
    # Keep embed + small chat fallback resident; leave headroom for music/STT.
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    # Soft cap: leave RAM for bot + Whisper base (NPU) + TurboVec on 16 GB boards.
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}

  # Dual-track STT: RKNN NPU Whisper base (faster-whisper CPU if .rknn missing)
  stt-whisper:
    # Inference is on the NPU; the CPU side is mel-spectrogram prep and request
    # handling, which still sits in the utterance latency path.
    cpuset: *cpuset-latency
    build:
      context: ./services/stt-rknn
      dockerfile: Dockerfile
    environment:
      - STT_MODEL=${STT_MODEL:-base}
      - STT_DEVICE=${STT_DEVICE:-npu}
      - STT_BACKEND=${STT_BACKEND:-rknn}
      - STT_FALLBACK=${STT_FALLBACK:-faster-whisper}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
      - STT_EAGER_LOAD=${STT_EAGER_LOAD:-1}
      - RKNN_MODELS_DIR=${RKNN_MODELS_DIR:-/models/rknn}
      - RKNN_ENCODER=${RKNN_ENCODER:-}
      - RKNN_DECODER=${RKNN_DECODER:-}
      # Used only when STT_BACKEND=sensevoice; shares the whisper-models volume.
      - SENSEVOICE_MODEL_DIR=${SENSEVOICE_MODEL_DIR:-/models/sensevoice}
      # On-chip SRAM for RKNN runtime (host/driver must support; see Rockchip doc)
      - RKNN_INTERNAL_MEM_TYPE=${RKNN_INTERNAL_MEM_TYPE:-sram}
      - RKNN_WEIGHT_MEM_TYPE=${RKNN_WEIGHT_MEM_TYPE:-}
    # NPU: DRM + device-tree + librknnrt. privileged required for rknnlite
    # container checks (same pattern as rkllama / Rockchip demos).
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-991}"
    volumes:
      - whisper-models:/models
      - whisper-fw-cache:/root/.cache
      - /usr/lib/librknnrt.so:/usr/lib/librknnrt.so:ro
      - /proc/device-tree/compatible:/proc/device-tree/compatible:ro

  piper-tts:
    # TTS is synchronous with a spoken reply — keep it off the little cores.
    cpuset: *cpuset-latency
    environment:
      - PIPER_VOICE=${PIPER_VOICE:-en_GB-cori-medium}
      - PIPER_MODEL=${PIPER_MODEL:-/models/en_GB-cori-medium.onnx}
      - PIPER_MODELS_DIR=${PIPER_MODELS_DIR:-/models}
