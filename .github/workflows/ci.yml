name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. Escalate per-job if that
# ever changes — never at the workflow level.
permissions:
  contents: read

# A new push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 = production parity (bot/Dockerfile builds on node:24-bookworm-slim).
        # 22 = the lower bound of `engines`, so a dependency that quietly raises
        # its floor fails here instead of on someone's machine. Node 20 was
        # dropped when it went EOL in April 2026.
        #
        # Keep both legs: npm >= 12 blocks dependency install scripts, which
        # silently ships a build with no better-sqlite3 binding and no Opus
        # addon (see `allowScripts` in bot/package.json).
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            bot/web/package-lock.json

      - name: Install (bot + workspaces)
        working-directory: bot
        run: npm ci

      - name: Install (web)
        working-directory: bot/web
        run: npm ci

      # The failure mode this repo actually hit: npm >= 12 skips dependency
      # install scripts unless allowScripts covers them, and allowScripts keys
      # are VERSION-PINNED — so bumping a native dep re-blocks its build with no
      # error. `npm ci` still exits 0; only requiring the module catches it.
      # audio-native binds system libopus through pkg-config. @discordjs/opus was
      # dropped (its vendored libopus cannot build under GCC 14 on arm64), so the
      # Rust addon is the ONLY codec — which makes it a build requirement, not an
      # optimisation. `npm run check` builds it, and every test that touches the
      # encoder fails without it, so both the toolchain and libopus must be here.
      - name: Install Opus toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
          # Fail with a clear message rather than an opaque napi build error if the
          # runner image ever stops shipping Rust.
          cargo --version || { echo "::error::cargo not found — audio-native cannot build"; exit 1; }
          pkg-config --modversion opus

      # Must EXERCISE the addon, not just require it: better-sqlite3's entry
      # module imports fine and only fails when the binding is first used, so a
      # bare require() reports success on a build that cannot open a database.
      - name: Verify better-sqlite3 binding
        working-directory: bot
        run: node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.close();console.log('better-sqlite3 ok')"

      # NOTE: the glibc-floor check deliberately does NOT run here. node-pre-gyp
      # downloads a prebuild matched to the CURRENT machine, so on a runner it
      # inspects a binary that never ships. It runs inside the image build
      # instead (bot/Dockerfile), where everything present is what ships.

      # Guards the same trap from the other side: a native dependency whose
      # installed version no longer matches its allowScripts key.
      - name: Verify allowScripts keys match installed versions
        working-directory: bot
        run: node ../scripts/check-allow-scripts.mjs

      # lint -> build ts6-client -> tsc --noEmit -> test:all (bot + ts6-client + web)
      - name: Check
        working-directory: bot
        run: npm run check

      # Runs AFTER `npm run check`, which is what builds the Rust addon — it does
      # not exist at npm ci time the way better-sqlite3 does. Exercise a real
      # encode/decode: loading the module proves nothing about whether it can
      # actually do Opus.
      - name: Verify audio-native Opus codec
        working-directory: bot
        run: |
          node -e "
          const { createOpusEncoder, opusBackendAvailable, PCM_FRAME_BYTES } = await import('./dist/audio/encoder.js');
          const info = opusBackendAvailable();
          if (!info.native) { console.error('FATAL: audio-native did not build — there is no fallback codec'); process.exit(1); }
          const enc = createOpusEncoder();
          const opus = enc.encode(Buffer.alloc(PCM_FRAME_BYTES, 0));
          const pcm = enc.decode(opus);
          if (!(opus.length > 0 && pcm.length >= PCM_FRAME_BYTES)) { console.error('FATAL: Opus round-trip failed'); process.exit(1); }
          console.log('audio-native ok:', JSON.stringify(info), 'opus bytes', opus.length);
          " --input-type=module

      - name: Build web
        working-directory: bot/web
        run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      # Kept separate from Renovate on purpose: Renovate does not manage npm
      # `overrides`, and this repo's remaining advisories are all resolved
      # through overrides on transitive packages. A dependency bot alone would
      # not have caught the tar override that pinned BACKWARD onto a vulnerable
      # version while looking like a mitigation.
      - name: Audit bot
        working-directory: bot
        run: npm audit --audit-level=moderate

      - name: Audit web
        working-directory: bot/web
        run: npm audit --audit-level=moderate
