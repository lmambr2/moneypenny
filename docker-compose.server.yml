# Moneypenny — Server edition overlay (x86_64, AMD GPU preferred)
#
# Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml \
#     --profile core --profile ollama --profile rag --profile voice-server up -d
#
# Or: ./install.sh --edition server
#
# Defaults: host Ollama 12B on GPU 1 (see docs/gpu-amd.md), Whisper large-v3-turbo
# (Vulkan on AMD, GPU 1 render node only), Piper en_GB-cori-high on CPU.
# Can also act as the LAN LLM host for an SBC edition (docs/editions.md).

services:
  bot:
    environment:
      - RKLLAMA_URL=${RKLLAMA_URL:-http://ollama:11434}
      - RKLLAMA_MODEL=${RKLLAMA_MODEL:-hf.co/unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL}
      - EMBEDDING_URL=${EMBEDDING_URL:-http://ollama:11434}
      # Higher-quality English embed on server (1024-d). SBC uses nomic v2.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-large-en-v1.5}
      - EMBEDDING_TIMEOUT_MS=${EMBEDDING_TIMEOUT_MS:-120000}
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://turbovec:6333}
      - MONEYPENNY_EDITION=server
      - SILERO_VAD_PATH=${SILERO_VAD_PATH:-/models/silero/silero_vad.onnx}
    volumes:
      - ${SILERO_MODELS_DIR:-./models/silero}:/models/silero:ro

  ollama:
    # Prefer host ollama-penny / ollama-desk (docs/gpu-amd.md). This container
    # path must not see both R9700s — pin GPU 1 only.
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      # Dual-R9700 later: set PENNY_GPU_INDEX=1 so this container never sees GPU 0.
      - HIP_VISIBLE_DEVICES=${PENNY_GPU_INDEX:-0}
      - GGML_VK_VISIBLE_DEVICES=${PENNY_GPU_INDEX:-0}
    # Uncomment when nvidia-container-toolkit is installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Dual-track STT: whisper.cpp (Vulkan on AMD when WHISPER_VULKAN=1 build)
  stt-whisper:
    build:
      context: ./services/stt-whisper-cpp
      dockerfile: Dockerfile
      args:
        WHISPER_VULKAN: ${WHISPER_VULKAN:-1}
    environment:
      # GPU 1 only. Full large-v3 only if turbo still mangles org names.
      - STT_MODEL=${STT_MODEL:-large-v3-turbo}
      - STT_DEVICE=${STT_DEVICE:-vulkan}
      - STT_BACKEND=whisper-cpp
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-float16}
      - STT_EAGER_LOAD=${STT_EAGER_LOAD:-1}
      - STT_MODELS_DIR=/models
      - STT_MODEL_PATH=${STT_MODEL_PATH:-}
      - STT_INITIAL_PROMPT=${STT_INITIAL_PROMPT:-Moneypenny, skip, pause, resume, volume, INTSUM, AAR, 600i, Colonel, Captain, Talon, hangar, quantum}
      - GGML_VK_VISIBLE_DEVICES=${GGML_VK_VISIBLE_DEVICES:-0}
      - WHISPER_BIN=${WHISPER_BIN:-whisper-cli}
    volumes:
      - whisper-models:/models
    # Bind Penny's render node only — never every /dev/dri node (GPU 0 is reserved).
    devices:
      - ${PENNY_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128
    group_add:
      # Host gids: ALWAYS export from host (Arch/CachyOS ≠ Debian 992/44):
      #   export RENDER_GID=$(getent group render | cut -d: -f3)
      #   export VIDEO_GID=$(getent group video | cut -d: -f3)
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"

  piper-tts:
    environment:
      - PIPER_VOICE=${PIPER_VOICE:-en_GB-cori-high}
      - PIPER_MODEL=${PIPER_MODEL:-/models/en_GB-cori-high.onnx}
      - PIPER_MODELS_DIR=${PIPER_MODELS_DIR:-/models}
