[package]
name = "audio-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
# System libopus via pkg-config
audiopus = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
